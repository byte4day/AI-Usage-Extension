name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package GNOME extension
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin zip
          node --check extension.js
          node --check prefs.js
          glib-compile-schemas --strict --dry-run schemas
          glib-compile-schemas schemas
          mkdir -p dist
          zip -q -r "dist/cursor-usage@byte4day.github.io.shell-extension.zip" \
            extension.js prefs.js stylesheet.css metadata.json \
            icon.png icon-22.png icons schemas/gschemas.compiled
          unzip -t "dist/cursor-usage@byte4day.github.io.shell-extension.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-extension
          path: dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows widget
        run: |
          cmake -S windows -B windows/build -G "Visual Studio 17 2022" -A x64
          cmake --build windows/build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-widget
          path: windows/build/Release/CursorUsage.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum "cursor-usage@byte4day.github.io.shell-extension.zip" CursorUsage.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            "cursor-usage@byte4day.github.io.shell-extension.zip" \
            CursorUsage.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
